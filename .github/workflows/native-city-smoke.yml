name: Native WebGL2 City Preview Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "sim/native_*.mjs"
      - "sim/world_city_facade_contract.mjs"
      - "sim/world_city_buildings.mjs"
      - "sim/real_world_bootstrap.mjs"
      - "tests/native_*.mjs"
      - ".github/workflows/native-city-smoke.yml"
      - "tests/control_semantics_test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-city-live:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native WebGL2 live comparison
        run: |
          set -euo pipefail
          npm install --prefix /tmp/native-city-qa --ignore-scripts --no-audit --no-fund three@0.185.1 puppeteer-core@24.16.0 esbuild@0.25.8 pngjs@7.0.0
          ln -s /tmp/native-city-qa/node_modules node_modules
          node tests/native_city_slice_contract_test.mjs
          ./node_modules/.bin/esbuild tests/native_city_live_hook.mjs --bundle --format=iife --platform=browser --target=es2022 --outfile=/tmp/native-city-live.bundle.js
      - name: Verify real city draw in same WebGL context without shader errors
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node tests/native_city_live_proof.mjs "$(node tools/public_site.mjs origin)/drone_simulator.html"
      - name: Save full-game matched-frame captures and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-native-city-optin-smoke
          path: artifacts/native-city-live/
          if-no-files-found: warn
          retention-days: 14
