name: SpawnCity player suggestions
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Nostr client
        run: |
          npm install --prefix /tmp/suggestions-deps --ignore-scripts --no-audit --no-fund nostr-tools@2.24.1
          ln -s /tmp/suggestions-deps/node_modules node_modules
      - name: Collect player feedback from configured public relays
        run: |
          mkdir -p artifacts
          node tests/collect_suggestions.mjs 2>&1 | tee artifacts/collect.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spawncity-suggestions
          path: artifacts/
          retention-days: 30
