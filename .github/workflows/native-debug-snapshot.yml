name: Native standalone reproduction snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - "sim/native_*.mjs"
      - "tests/native_*.mjs"
      - ".github/workflows/native-debug-snapshot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: emscripten/emsdk:6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Create sanitized local-reproduction package from working tree
        run: |
          set -eu
          tar --exclude='*.bin' --exclude='*.wasm' --exclude='*.zip' \
            -czf /tmp/native-source-repro.tgz sim tests esp32 \
              tools/patch_box3d_upstream_bindings.mjs \
              .github/workflows/renderer-compare.yml \
              .github/workflows/box3d-upstream-wasm.yml
          mkdir -p artifacts/native-debug-snapshot
          cp /tmp/native-source-repro.tgz artifacts/native-debug-snapshot/
      - name: Compile actual Flight Core firmware adapter for local Node execution
        run: |
          em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
            -s MODULARIZE=1 -s EXPORT_ES6=1 -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 \
            -s FILESYSTEM=0 -s SINGLE_FILE=1 -s ALLOW_MEMORY_GROWTH=0 \
            -s INITIAL_MEMORY=16777216 \
            -s 'EXPORTED_RUNTIME_METHODS=["HEAPU8"]' \
            -s 'EXPORTED_FUNCTIONS=["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
            -s ENVIRONMENT=node -o artifacts/native-debug-snapshot/flight_core_node.mjs
      - name: Publish reproducible source for disconnected test runners
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-native-repro
          path: artifacts/native-debug-snapshot/
          retention-days: 2
