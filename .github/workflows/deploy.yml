name: Deploy SpawnCity

# spawncity.de = SpawnCity on Kern: Kern's CI builds the drop-in (kernengine.de, branch
# spawncity-de-dropin, from every green main); this publishes it to GitHub Pages here.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Kern's drop-in
        id: fetch
        run: |
          set -euo pipefail
          if ! git clone -q --depth 1 -b spawncity-de-dropin https://github.com/ChristianHohlfeld/kernengine.de site; then
            echo "no drop-in published yet: the site stays as it is"; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          src=$(git -C site log -1 --format=%s)
          rm -rf site/.git
          # the files the game needs at the original's addresses
          for f in drone_simulator.html drone_simulator.webmanifest host.mjs spawncity.wasm oppenheimer-sw.js sw.js kern/web/kern.mjs kern/web/jobs.mjs; do
            test -s "site/$f" || { echo "drop-in incomplete: $f" >&2; exit 1; }
          done
          cp site/drone_simulator.html site/index.html  # spawncity.de/ opens the game
          echo spawncity.de > site/CNAME
          touch site/.nojekyll
          echo "ok=1" >> "$GITHUB_OUTPUT"
          echo "src=$src" >> "$GITHUB_OUTPUT"
      - name: Publish (only when it changed)
        if: steps.fetch.outputs.ok == '1'
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" live || true
          if [ -d live ] && diff -rq --exclude=.git site live >/dev/null; then echo "unchanged"; exit 0; fi
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${{ steps.fetch.outputs.src }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
