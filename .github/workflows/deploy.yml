name: Deploy SpawnCity

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure GitHub Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            curl -sS -o /tmp/pages-body.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }
          code="$(api -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"build_type":"workflow"}')"
          echo "create pages HTTP ${code}"
          cat /tmp/pages-body.json; echo
          code="$(api -X PUT "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"build_type":"workflow","cname":"spawncity.de","https_enforced":true}')"
          echo "cname+https HTTP ${code}"
          cat /tmp/pages-body.json; echo
          if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
            code="$(api -X PUT "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"build_type":"workflow","cname":"spawncity.de"}')"
            echo "cname HTTP ${code}"
            cat /tmp/pages-body.json; echo
          fi

      - name: Import the game tree
        run: |
          set -euxo pipefail
          mkdir -p /tmp/overlay/sim /tmp/overlay/tools /tmp/overlay/tests /tmp/overlay/docs
          for f in sim/site_config.mjs sim/music_player.mjs sim/lan_vs.mjs sim/changelog_menu.mjs; do
            if [ -f "$f" ]; then cp "$f" "/tmp/overlay/sim/$(basename "$f")"; fi
          done
          for f in tools/public_site.mjs tools/s31_hil_bridge.mjs; do
            if [ -f "$f" ]; then cp "$f" "/tmp/overlay/tools/$(basename "$f")"; fi
          done
          for f in tests/site_config_test.mjs tests/live_site.mjs; do
            if [ -f "$f" ]; then cp "$f" "/tmp/overlay/tests/$(basename "$f")"; fi
          done
          if [ -f docs/SPAWNCITY_DEPLOY.md ]; then cp docs/SPAWNCITY_DEPLOY.md /tmp/overlay/docs/; fi
          for f in index.html CNAME; do
            if [ -f "$f" ]; then cp "$f" /tmp/overlay/; fi
          done
          rm -rf /tmp/kl
          git init /tmp/kl
          git -C /tmp/kl fetch --depth 1 https://github.com/nostack-dev/kurzlernen-de.git 1508ec0f28d71b5cf9b6cd922335f856177012ef
          git -C /tmp/kl checkout FETCH_HEAD
          rm -rf sim esp32
          cp -a /tmp/kl/sim /tmp/kl/esp32 .
          cp /tmp/kl/drone_simulator.html /tmp/kl/drone_controller.html /tmp/kl/drone_simulator.webmanifest /tmp/kl/oppenheimer-sw.js .
          mkdir -p tests docs tools
          cp /tmp/kl/tests/sil_wasm_smoke.mjs tests/
          if [ -d /tmp/overlay/sim ]; then cp /tmp/overlay/sim/* sim/; fi
          if [ -d /tmp/overlay/tools ]; then cp /tmp/overlay/tools/* tools/; fi
          if [ -d /tmp/overlay/tests ]; then cp /tmp/overlay/tests/* tests/; fi
          if [ -d /tmp/overlay/docs ]; then cp /tmp/overlay/docs/* docs/; fi
          if [ -f /tmp/overlay/index.html ]; then cp /tmp/overlay/index.html .; fi
          if [ -f /tmp/overlay/CNAME ]; then cp /tmp/overlay/CNAME .; fi
          python3 - <<'PY'
          from pathlib import Path
          host=Path("CNAME").read_text().strip()
          page=Path("drone_simulator.html")
          html=page.read_text()
          canon=f"https://{host}/drone_simulator.html"
          image=f"https://{host}/sim/icons/spawncity-512.png"
          if 'rel="canonical"' not in html:
              block=(
                  '<meta name="description" content="SpawnCity – Drohne, zu Fuß, Auto und Jet in deiner echten Stadt.">\n'
                  '<meta property="og:site_name" content="SpawnCity">\n'
                  '<meta property="og:title" content="SpawnCity">\n'
                  '<meta property="og:description" content="SpawnCity – Drohne, zu Fuß, Auto und Jet in deiner echten Stadt.">\n'
                  '<meta property="og:type" content="website">\n'
                  f'<meta property="og:url" content="{canon}">\n'
                  f'<meta property="og:image" content="{image}">\n'
                  f'<link rel="canonical" href="{canon}">\n'
              )
              html=html.replace("<title>SpawnCity</title>", block+"<title>SpawnCity</title>", 1)
              page.write_text(html)
          controller=Path("drone_controller.html")
          chtml=controller.read_text().replace("<title>OPPENHEIMER Remote</title>","<title>SpawnCity Remote</title>").replace("OPPENHEIMER · REMOTE","SPAWNCITY · REMOTE")
          controller.write_text(chtml)
          lan=Path("sim/lan_vs.mjs")
          ltxt=lan.read_text()
          old='const APP_ID="arondight45-kurzlernen-vs-v3";'
          new='import {SITE} from "./site_config.mjs";\nconst APP_ID=SITE.multiplayerAppId;'
          if old in ltxt and "APP_ID=SITE.multiplayerAppId" not in ltxt:
              lan.write_text(ltxt.replace(old, new, 1))
          log=Path("sim/changelog_menu.mjs")
          ctxt=log.read_text()
          if "spawncity.de wird die Adresse" not in ctxt:
              entry='  {date:"2026-10-15",time:"23:58",title:"spawncity.de wird die Adresse",items:[\n    "kurzlernen.de öffnet das Spiel weiter, bis spawncity.de fertig geschaltet ist. Danach geht die Startseite der neuen Adresse direkt ins Spiel.",\n    "Mitspieler finden sich weiter im selben Raum – die Verbindung hängt nicht am Domainnamen.",\n    "Die Home-Bildschirm-App bleibt an der Adresse, mit der du sie angelegt hast. Wenn spawncity.de live ist: einmal dort öffnen und neu auf den Home-Bildschirm legen."]},\n'
              ctxt=ctxt.replace("export const CHANGELOG=Object.freeze([\n", "export const CHANGELOG=Object.freeze([\n"+entry, 1)
              log.write_text(ctxt)
          PY
          test "$(tr -d '[:space:]' < CNAME)" = "spawncity.de"
          rm -f bin-probe.txt

      - name: Check SpawnCity site config
        run: node tests/site_config_test.mjs

      - name: Build exact shared controller runtime to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          FLAGS=(-std=c++17 -O3 -s MODULARIZE=1 -s EXPORT_ES6=1 -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1
            -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 -s "EXPORTED_RUNTIME_METHODS=[\"HEAPU8\"]"
            -s "EXPORTED_FUNCTIONS=[\"_fc_input_buffer\",\"_fc_output_buffer\",\"_fc_input_size\",\"_fc_output_size\",\"_fc_reset\",\"_fc_process\",\"_fc_protocol_version\"]")
          have_image=0
          for i in 1 2 3 4; do if docker pull -q emscripten/emsdk:4.0.10; then have_image=1; break; fi; sleep $((i*15)); done
          if [ "$have_image" = 1 ]; then
            EMXX=(docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 em++)
          else
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
            "$RUNNER_TEMP/emsdk/emsdk" install 4.0.10
            "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.10
            source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
            EMXX=(em++)
          fi
          "${EMXX[@]}" sim/Arondight45_DroneFC_SIL_WASM.cpp "${FLAGS[@]}" -s ENVIRONMENT='web' -o generated/flight_core.mjs
          "${EMXX[@]}" sim/Arondight45_DroneFC_SIL_WASM.cpp "${FLAGS[@]}" -s ENVIRONMENT='node' -o generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs

      - name: Bundle self-contained Pages
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/spawncity-web-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 mqtt@5.15.2 nostr-tools@2.24.1 \
            qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/spawncity-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/spawncity-controller.bundle.mjs
          python3 - <<'PY'
          import os
          from pathlib import Path
          sha=os.environ["GITHUB_SHA"]
          builds=[
              ("drone_simulator.html","<script type=\"module\" src=\"./sim/real_world_bootstrap.mjs\"></script>","/tmp/spawncity-simulator.bundle.mjs"),
              ("drone_simulator.html","<script type=\"module\" src=\"./sim/auto_flight_start.mjs\"></script>","sim/auto_flight_start.mjs"),
              ("drone_controller.html","<script type=\"module\" src=\"./sim/controller.mjs\"></script>","/tmp/spawncity-controller.bundle.mjs"),
          ]
          prefix=f"<!-- ARONDIGHT45_BUILD_SHA:{sha} -->\n"
          for html_name,marker,bundle_name in builds:
              path=Path(html_name); html=path.read_text(); assert marker in html, marker
              bundle=Path(bundle_name).read_text().replace("</script","<\\/script")
              html=html.replace(marker,"<script type=\"module\">\n"+bundle+"\n</script>")
              if prefix not in html: html=prefix+html
              path.write_text(html)
          PY
          test "$(wc -c < drone_simulator.html)" -gt 100000
          grep -q "ARONDIGHT45_BUILD_SHA:${GITHUB_SHA}" drone_simulator.html
          grep -q "foot-pistol-fresh-v1" drone_simulator.html
          node tools/public_site.mjs build-json "$GITHUB_SHA" > build.json
          grep -q "$GITHUB_SHA" build.json
          rm -rf generated node_modules

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/artifacts?per_page=100" | jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length')"
            if [ "${count}" -ge 1 ]; then
              echo "github-pages artifact is visible"
              exit 0
            fi
            sleep 2
          done
          echo "github-pages artifact never became visible" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4

  live-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify live game once DNS answers
        continue-on-error: true
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          origin="$(node tools/public_site.mjs origin)"
          fetched=0
          for attempt in $(seq 1 8); do
            if curl -fsSL --retry 1 --connect-timeout 8 --max-time 20 -H "Cache-Control: no-cache" \
              "$origin/drone_simulator.html?ci=${GH_SHA}-${attempt}" -o /tmp/spawncity-live.html \
              && grep -q "ARONDIGHT45_BUILD_SHA:${GH_SHA}" /tmp/spawncity-live.html; then
              fetched=1
              break
            fi
            sleep 5
          done
          test "$fetched" = 1
