name: One-time SpawnCity source consolidation
on:
  push:
    branches: ["consolidate-spawncity-source-20261016"]
    paths: [".github/workflows/import-game.yml"]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import complete game source with standalone overrides and tests
        run: |
          set -euxo pipefail
          SRC_SHA=2165abec7f59fe2cc27e82db3bba7d5531aaa9f9
          mkdir -p /tmp/overrides
          for f in sim/site_config.mjs sim/music_player.mjs sim/spawncity_exit_guard.js sim/spawncity_layout.css; do
            cp "$f" /tmp/overrides/
          done
          git init -q /tmp/kurz-source
          git -C /tmp/kurz-source fetch -q --depth 1 https://github.com/nostack-dev/kurzlernen-de.git "$SRC_SHA"
          git -C /tmp/kurz-source checkout -q FETCH_HEAD
          test "$(git -C /tmp/kurz-source rev-parse HEAD)" = "$SRC_SHA"
          mkdir -p sim esp32 tests
          cp -a /tmp/kurz-source/sim/. sim/
          cp -a /tmp/kurz-source/esp32/. esp32/
          cp -a /tmp/kurz-source/drone_simulator.html /tmp/kurz-source/drone_controller.html /tmp/kurz-source/drone_simulator.webmanifest /tmp/kurz-source/oppenheimer-sw.js ./
          cp /tmp/kurz-source/tests/sil_wasm_smoke.mjs tests/
          for f in site_config.mjs music_player.mjs spawncity_exit_guard.js spawncity_layout.css; do
            cp "/tmp/overrides/$f" "sim/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          host=Path("CNAME").read_text().strip()
          assert host=="spawncity.de"
          page=Path("drone_simulator.html")
          html=page.read_text()
          seo=Path("seo/head.html")
          assert seo.exists()
          head=seo.read_text().replace("{HOST}",host)
          assert "<title>SpawnCity</title>" in html
          assert 'name="twitter:card"' not in html
          html=html.replace("<title>SpawnCity</title>",head+"<title>SpawnCity – Drohne, Auto &amp; Jet in deiner echten Stadt</title>",1)
          css=Path("sim/spawncity_layout.css").read_text()
          assert 'id="spawncityLayout"' not in html
          i=html.rfind("</head>")
          assert i>=0
          html=html[:i]+'<style id="spawncityLayout">\n'+css+'</style>\n'+html[i:]
          js=Path("sim/spawncity_exit_guard.js").read_text().replace("</script","<\\/script")
          assert 'id="spawncityExitGuard"' not in html
          i=html.rfind("</body>")
          assert i>=0
          html=html[:i]+'<script id="spawncityExitGuard">\n'+js+'</script>\n'+html[i:]
          page.write_text(html)
          for name in ("spawncity-card.png","robots.txt","sitemap.xml"):
              src=Path("seo")/name
              assert src.exists()
              if name.endswith(".png"): Path(name).write_bytes(src.read_bytes())
              else:Path(name).write_text(src.read_text().replace("{HOST}",host))
          controller=Path("drone_controller.html")
          c=controller.read_text().replace("<title>OPPENHEIMER Remote</title>",'<meta name="robots" content="noindex">\n<title>SpawnCity Remote</title>').replace("OPPENHEIMER · REMOTE","SPAWNCITY · REMOTE")
          controller.write_text(c)
          lan=Path("sim/lan_vs.mjs")
          old=lan.read_text()
          new='import {SITE} from "./site_config.mjs";\nconst APP_ID=SITE.multiplayerAppId;'
          if "APP_ID=SITE.multiplayerAppId" not in old:
              updated,n=re.subn(r'^const APP_ID="[^"]*";',lambda m:new,old,count=1,flags=re.M)
              assert n==1,"APP_ID declaration not found"
              lan.write_text(updated)
          log=Path("sim/changelog_menu.mjs")
          t=log.read_text()
          assert "Neuer Mehrspieler-Raum" not in t
          anchor='  {date:"2026-10-15",time:"23:49"'
          assert anchor in t
          entries='''  {date:"2026-10-16",time:"03:30",title:"Neue Hände, Sniper-Timing, Fixes",items:[
              "Neue Hände in der Ego-Sicht und eine schnellere Messer-Animation.",
              "Sniper: Treffer und Einschlag kommen erst an, wenn die Kugel da ist.",
              "Granatwerfer-Explosionen sind wieder deutlich zu hören.",
              "Auf Dachaufbauten (Treppenhäuser) kann man jetzt stehen.",
              "Gebäude sind beim Start nicht mehr schon eingestürzt.",
              "Startmenü passt auf das Handy quer, und EXIT ist immer erreichbar."]},
            {date:"2026-10-16",time:"02:30",title:"Neuer Mehrspieler-Raum",items:[
              "SpawnCity hat jetzt einen eigenen Mehrspieler-Raum.",
              "Bitte die Seite einmal neu laden. Wer noch eine ältere Version offen hat, sieht die anderen erst nach dem Neuladen.",
              "Die Fernsteuerung (Remote) wird einfach neu gekoppelt wie bisher."]},
            {date:"2026-10-15",time:"23:58",title:"spawncity.de ist die Adresse",items:[
              "Das Spiel läuft jetzt unter spawncity.de. Die Startseite geht direkt ins Spiel.",
              "Die Home-Bildschirm-App bleibt an der Adresse, mit der du sie angelegt hast. Einmal unter spawncity.de öffnen und neu auf den Home-Bildschirm legen."]},
          '''
          log.write_text(t.replace(anchor,entries+anchor,1))
          PY
          node tests/site_config_test.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/lan_vs.mjs
          node --check sim/changelog_menu.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drone_simulator.html drone_controller.html drone_simulator.webmanifest oppenheimer-sw.js sim esp32 tests/sil_wasm_smoke.mjs spawncity-card.png robots.txt sitemap.xml
          git rm -f .github/workflows/import-game.yml
          git commit -m "Own complete SpawnCity game sources (migrated from kurzlernen-de)" -m "Source snapshot: nostack-dev/kurzlernen-de@2165abec7f59fe2cc27e82db3bba7d5531aaa9f9. Preserve SpawnCity-specific settings, standalone assets, sorted changelog and verification."
          git push origin HEAD:consolidate-spawncity-source-20261016
