name: SpawnCity WebGL visual and performance A/B
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy SpawnCity"]
    types: [completed]
  workflow_dispatch:
    inputs:
      baseline_url:
        description: Published baseline game URL
        required: false
      candidate_url:
        description: Published candidate game URL (or same URL with fast preset)
        required: false
permissions:
  contents: read
jobs:
  compare:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual comparison runner
        run: |
          npm install --prefix /tmp/webgl-ab --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
          ln -s /tmp/webgl-ab/node_modules node_modules
          node --check tests/renderer_ab_compare.mjs
      - name: Compare desktop and mobile under identical GPS and browser settings
        env:
          BASELINE: ${{ inputs.baseline_url }}
          CANDIDATE: ${{ inputs.candidate_url }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          ORIGIN="$(node tools/public_site.mjs origin)"
          # Published comparison must observe the exact just-built commit.
          if [ -n "$EXPECTED_SHA" ]; then
            matched=0
            for attempt in $(seq 1 45); do
              if curl -fsSL --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "$ORIGIN/build.json?render_proof=$attempt" -o /tmp/spawncity-live-build.json                 && node -e 'if(require("/tmp/spawncity-live-build.json").sha!==process.argv[1])process.exit(1)' "$EXPECTED_SHA"; then
                matched=1
                break
              fi
              sleep 7
            done
            if [ "$matched" != 1 ]; then echo "::error::Live build SHA does not match the deploy being compared"; exit 1; fi
          fi
          CHROME_BIN="$CHROME_BIN" node tests/renderer_ab_compare.mjs "${BASELINE:-$ORIGIN/drone_simulator.html}" "${CANDIDATE:-$ORIGIN/drone_simulator.html}"
      - name: Save images and metrics for actual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-webgl-ab
          path: artifacts/renderer-ab/
          if-no-files-found: warn

  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local rendering microbenchmark (no CDN)
        run: |
          npm install --prefix /tmp/native-bench --ignore-scripts --no-audit --no-fund three@0.185.1 puppeteer-core@24.16.0 esbuild@0.25.8
          ln -s /tmp/native-bench/node_modules node_modules
          node --check tests/native_webgl_proof.mjs
          ./node_modules/.bin/esbuild tests/native_webgl_proof_scene.mjs --bundle --format=iife --platform=browser --target=es2022 --outfile=/tmp/native-webgl-proof.bundle.js
      - name: Measure same batched city geometry with Three and raw WebGL2
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node tests/native_webgl_proof.mjs
      - name: Save raw GPU/CPU timing and image-comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-native-webgl-proof
          path: artifacts/native-webgl-proof/
          if-no-files-found: warn

  complete-engine-gate:
    # This check stays RED until both the entire game is Three-free and
    # 15 real-device/mode visual+GPU parity scenarios pass. No automatic
    # renderer rollout merely because the isolated WebGL2 proof is faster.
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate acceptance logic, reject fake DPR/performance wins
        run: |
          node --check tests/renderer_acceptance_gate.mjs
          node tests/renderer_acceptance_selftest.mjs
      - name: Require all native renderer API, pixel and on-device GPU acceptance gates
        run: node tests/renderer_acceptance_gate.mjs --gate
      - name: Preserve measured migration blockers and missing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-native-engine-release-gate
          path: artifacts/renderer-gate/readiness.json
          if-no-files-found: warn

  actual-city-geometry:
    # Compare native draw calls against the actual streamed world-city chunks.
    # This is a real source geometry test, not production shading or full-engine parity.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle candidate native path for live-world geometry probe
        run: |
          npm install --prefix /tmp/real-city-bench --ignore-scripts --no-audit --no-fund three@0.185.1 puppeteer-core@24.16.0 esbuild@0.25.8
          ln -s /tmp/real-city-bench/node_modules node_modules
          node --check tests/native_real_city_proof.mjs
          ./node_modules/.bin/esbuild tests/native_real_city_scene.mjs --bundle --format=iife --platform=browser --target=es2022 --outfile=/tmp/native-real-city.bundle.js
      - name: Inspect ACTUAL published city chunks in matched native/Three WebGL
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node tests/native_real_city_proof.mjs "$(node tools/public_site.mjs origin)/drone_simulator.html"
      - name: Save real-city pictures and render timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-native-real-city-proof
          path: artifacts/native-real-city/
          if-no-files-found: warn

  live-native-city-slice:
    # Inject this PR's real raw WebGL2 city pass into the published game.
    # Compare a complete gameplay frame before/after, without publishing the
    # incomplete path or modifying the real host.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle candidate mixed-renderer live probe
        run: |
          npm install --prefix /tmp/native-city-live --ignore-scripts --no-audit --no-fund three@0.185.1 puppeteer-core@24.16.0 esbuild@0.25.8 pngjs@7.0.0
          ln -s /tmp/native-city-live/node_modules node_modules
          node --check tests/native_city_live_proof.mjs
          ./node_modules/.bin/esbuild tests/native_city_live_hook.mjs --bundle --format=iife --platform=browser --target=es2022 --outfile=/tmp/native-city-live.bundle.js
      - name: Compare full-frame real game against candidate opt-in city pass
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node tests/native_city_live_proof.mjs "$(node tools/public_site.mjs origin)/drone_simulator.html"
      - name: Save full-game visual differences and opt-in runtime benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawncity-native-city-live-trial
          path: artifacts/native-city-live/
          if-no-files-found: warn
