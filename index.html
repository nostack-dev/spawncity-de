  .sc-pop { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font: 700 clamp(15px, 2.6vw, 24px) Inter, system-ui, sans-serif; letter-spacing: .16em;

  /* desktop_controls.mjs #desktopKeyHints: centred under the top bar, fades 12 s after a change */

  body.pad-input, body.pad-input canvas { cursor: none; }
  /* touch play: the credits stay readable but never take a thumb's touch from the controls */
  body.sc-touch-on .sc-attrib { pointer-events: none; font-size: 9px; }
  /* simulator.mjs syncSoloPresentationOrientation: a portrait phone plays a landscape turned by 90 deg
     (logical x = screen y, logical y = screen width - screen x); menus turn with it */
  /* the original turns #viewport (and open dialogs) itself in portrait (original.css); the page is
     already turned here, so that turn would come on top (upside down, the view off the screen):
     the viewport fills the turned page, dialogs stay as they are; the safe-area insets keep the
     original's quarter-turned mapping */
  /* jet: EJECT / AUSSTEIGEN under the score and the FLOW bar, not over the vitals */
  /* Kern: the compact touch HUD (as the big mobile shooters do it): the picture is the game - slim
     top row (icons, no wide labels), see-through sticks (a thin ring and a soft knob: the touch area
     stays the full 168 px), action buttons a size smaller and translucent until pressed, a smaller
     minimap, the voice buttons only in MULTI. The game reads every button's rectangle from here, so
     touches follow the new sizes. */
  html body:not(.desktop-input) #viewport :is(.foot-stick .ring, .solo-stick .solo-ring) { background: radial-gradient(circle, rgba(255,255,255,.05) 0 55%, rgba(255,255,255,.09) 100%) !important; border: 1.5px solid rgba(255,255,255,.28) !important; box-shadow: none !important; }
  html body:not(.desktop-input) #viewport :is(.foot-stick .knob, .solo-stick .solo-knob) { background: rgba(255,255,255,.22) !important; border: 1.5px solid rgba(255,255,255,.55) !important; box-shadow: none !important; transform: translate(-50%, -50%) scale(.78) !important; }
  html body:not(.desktop-input) #viewport :is(.foot-stick, .solo-stick) > span { opacity: .45 !important; font-size: 9px !important; }
  html body:not(.desktop-input) #viewport :is(#footJump, #thumbWeapon, #airStrikeButton, #handGrenadeBtn, #footFire, #soloArm, #soloKill, #mobileGameplayMode, #footScope, .thumb-scope) { opacity: .78; transform-origin: center; }
  html body:not(.desktop-input) #viewport :is(#footJump, #thumbWeapon, #airStrikeButton, #handGrenadeBtn, #footFire, #soloArm, #soloKill, #mobileGameplayMode):active { opacity: 1; }
  html body:not(.desktop-input) #viewport :is(#footJump) { width: 54px !important; height: 54px !important; font-size: 11px !important; }
  html body:not(.desktop-input) #viewport :is(#thumbWeapon, #handGrenadeBtn) { width: 52px !important; height: 52px !important; font-size: 9px !important; }
  html body:not(.desktop-input) #viewport #airStrikeButton { width: 50px !important; height: 50px !important; font-size: 9px !important; }
  html body:not(.desktop-input) #viewport #mobileGameplayMode { height: 34px !important; min-width: 0 !important; width: auto !important; padding: 0 12px !important; font-size: 12px !important; }
  html body:not(.desktop-input) #viewport :is(#soloArm, #soloKill) { height: 38px !important; font-size: 12px !important; }
  /* the top row: 32 px, icons */
  html body:not(.desktop-input) #viewport :is(#gameExitButton, #mobileGameplayMultiplayer, #mobileGameplaySettings, #mobileGameplayReset) { height: 32px !important; min-height: 0 !important; font-size: 11px !important; padding: 0 10px !important; }
  html body:not(.desktop-input) #viewport #mobileGameplaySettings { width: 36px !important; min-width: 0 !important; padding: 0 !important; font-size: 0 !important; }
  html body:not(.desktop-input) #viewport #mobileGameplaySettings::after { content: "⚙"; font-size: 18px; line-height: 32px; }
  html body:not(.desktop-input) #viewport #mobileGameplayDock { width: auto !important; min-width: 0 !important; padding: 0 !important; background: none !important; border: 0 !important; box-shadow: none !important; }
  html body:not(.desktop-input) #viewport :is(#soundSwitch, #musicSwitch) { width: 34px !important; height: 34px !important; }
  html body:not(.desktop-input) #viewport :is(#soundSwitch, #musicSwitch) svg { width: 16px !important; height: 16px !important; }
  html body:not(.desktop-input) #viewport :is(#soundSwitch, #musicSwitch)::after { font-size: 9px !important; }
  html body:not(.desktop-input):not(.sc-mp-on) #viewport #proximityVoiceBar { display: none !important; }

  html body #viewport #proximityVoiceBar #proximityVoicePtt, html body #viewport #proximityVoiceBar #proximityVoiceMute { position: relative; transition: background .15s, border-color .15s, opacity .15s; }
  html body #viewport #proximityVoiceBar #proximityVoicePtt[data-on="1"], html body #viewport #proximityVoiceBar #proximityVoiceMute[data-on="1"] { background: #17694fe6 !important; border-color: #62d6aa !important; box-shadow: 0 0 0 2px #62d6aa55, 0 0 12px #62d6aa88 !important; opacity: 1 !important; }
  html body #viewport #proximityVoiceBar #proximityVoicePtt[data-on="0"], html body #viewport #proximityVoiceBar #proximityVoiceMute[data-on="0"] { background: #1b1f26d9 !important; border-color: #ffffff40 !important; box-shadow: none !important; opacity: .8; }
  html body #viewport #proximityVoiceBar #proximityVoicePtt[data-on="0"]::after, html body #viewport #proximityVoiceBar #proximityVoiceMute[data-on="0"]::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 2px; background: #ff6b5a; transform: rotate(-35deg); pointer-events: none; }
  html body #viewport #proximityVoiceBar #proximityVoicePtt[data-on="1"] { animation: scMicLive 1.6s ease-in-out infinite; }
  @keyframes scMicLive { 50% { box-shadow: 0 0 0 4px #62d6aa33, 0 0 18px #62d6aaaa; } }

  html body:not(.desktop-input) #viewport #worldLookHud { transform: scale(.8); transform-origin: right top; opacity: .88; }
  /* the minimap in every world (the original showed it only in the real world: the training town too), and its big map */
  body.solo-flight #viewport #worldLookHud { display: block; }
  /* the right stick off the edge (touch_play.h kRightInset): room for the thumb to turn */
  html body:not(.desktop-input) #viewport #footLook { right: calc(var(--solo-safe-right, env(safe-area-inset-right, 0px)) + 76px) !important; }
  /* on foot (touch): no FIRE button - the screen fires where it is touched (the original) */
  html body.sc-touch-on.on-foot-mode:not(.player-driving):not(.jet-mode) #viewport #footHud #footFire { display: none !important; }
  /* sound and music switches: what they are and whether they are on, at a glance */
  html body #soundSwitch, html body #musicSwitch { flex-direction: column !important; gap: 2px !important; height: auto !important; min-height: 40px !important; padding: 4px 6px !important; border-radius: 10px !important; transition: background .15s, border-color .15s; }
  html body #soundSwitch::after, html body #musicSwitch::after { font: 800 8px/1 Inter, system-ui, sans-serif; letter-spacing: .1em; white-space: nowrap; }
  html body #soundSwitch[data-on="1"]::after { content: "AN"; color: #7ff0c5; }
  html body #soundSwitch[data-on="0"]::after { content: "AUS"; color: #ff9a8a; }
  html body #musicSwitch[data-on="1"]::after { content: "AN"; color: #7ff0c5; }
  html body #musicSwitch[data-on="0"]::after { content: "AUS"; color: #ff9a8a; }

  .sc-attrib { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10.5px; color: rgba(255, 255, 255, .78);

  body.sc-touch-on .sc-panel { left: auto; right: max(14px, env(safe-area-inset-right)); top: calc(max(12px, env(safe-area-inset-top)) + 40px); bottom: auto; min-width: 150px; }

  body.sc-touch-on .sc-fps { display: none; }
  /* Touch: a compact panel that ends above the context buttons over the right stick. */
  body.sc-touch-on .sc-panel { padding: 6px 10px; min-width: 130px; }
  body.sc-touch-on .sc-speed b { font-size: 20px; }
  body.sc-touch-on .sc-rows div:nth-child(n+3) { display: none; }
  @media (max-width: 640px) { .sc-fps { display: none; } .sc-speed b { font-size: 24px; } }
</style>

<style>
