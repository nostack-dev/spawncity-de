<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>SpawnCity — Native WebGL2</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07111c;color:#f6fbff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
#viewport{position:fixed;inset:0;background:#0b1522;touch-action:none}
#viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));pointer-events:none;
font:600 12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:0 1px 2px #000a}
#hud strong{font-size:13px;font-weight:800;letter-spacing:.08em}#hud span{font-size:10px;letter-spacing:.14em;color:#9fb4c6}
#telemetry{margin-top:2px;color:#d5e2ee99;font-size:10px;max-width:42vw}
#status{margin-top:2px;color:#d7ffe6;max-width:46vw;font-size:12px}
#gameMenu{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#06101cee;backdrop-filter:blur(15px)}
#gameMenu[hidden]{display:none}#welcome{padding:28px;max-width:min(94vw,480px);text-align:center}
h1{font-size:clamp(38px,9vw,68px);letter-spacing:-3px;margin:0 0 10px;font-weight:950}
p{color:#b8cedf;line-height:1.5}
button{color:inherit;font:inherit;touch-action:manipulation;cursor:pointer}
#gameMenuStart{border:none;border-radius:16px;background:#ffb42d;color:#121820;font-weight:900;font-size:18px;padding:17px 52px;margin-top:12px}
#gameMenuStart:disabled{opacity:.5}#gameMenuStatus{margin-top:16px;font-size:12px;color:#b4c5d5}
#worldSource{display:block;width:min(100%,390px);margin:16px auto 4px;padding:11px 14px;border-radius:12px;
border:1px solid #4c708d;background:#142c40;color:#f1fbff;font:600 14px system-ui}
#toolbar{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-radius:18px;background:#071523c9;
border:1px solid #9dc4ef37;z-index:5;max-width:calc(100vw - 16px);backdrop-filter:blur(12px)}
#toolbar button{background:#153148;border:1px solid #345775;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:800;min-width:38px}
#toolbar button[aria-pressed=true]{background:#ffb42d;color:#162136;border-color:#ffb42d}
#armButton{background:#6d2929!important}#armButton[aria-pressed=true]{background:#f5bd29!important}
#sticks{display:none;position:fixed;inset:0;pointer-events:none;z-index:2}
.joystick{position:absolute;bottom:18%;border:2px dashed #daeafd50;border-radius:50%;width:84px;height:84px;
display:grid;place-items:center;font-size:11px;color:#daebff90;letter-spacing:.08em}
#stickLeft{left:8%}#stickRight{right:8%}
#help{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);font-size:10px;pointer-events:none;z-index:4;color:#c7d8eaca;text-align:center;white-space:nowrap}
#osmAttribution{position:fixed;bottom:max(5px,env(safe-area-inset-bottom));left:8px;
 z-index:4;font:10px system-ui,sans-serif;color:#d3e4f6;text-decoration:none;
 text-shadow:0 1px 4px #001a;max-width:180px}
body.desktop-input #help{display:none}
@media(pointer:coarse){#help{bottom:95px;white-space:normal;width:85vw}
#toolbar{top:max(8px,env(safe-area-inset-top));bottom:auto;padding:7px;gap:4px}#toolbar button{padding:9px 10px;font-size:11px}#hud{font-size:10px}}
@media(max-width:370px){#toolbar button{padding:8px 6px}#welcome{padding:16px}}
</style>
</head>
<body>
<div id="viewport" aria-label="Native WebGL2 game viewport"></div>
<div id="hud" aria-live="polite"><strong>SPAWNCITY</strong> <span>WEBGL2</span><div id="telemetry">READY</div><div id="status">Real Box3D · 1 kHz Flight Core</div></div>
<div id="sticks" aria-hidden="true"><div class="joystick" id="stickLeft">MOVE</div><div class="joystick" id="stickRight">LOOK</div></div>
<div id="help">WASD fly · SPACE / SHIFT up / down · MOUSE turn · RMB look · R arm · C camera · V on foot</div>
<div id="toolbar" role="toolbar" aria-label="Game mode and camera">
<button data-mode="drone" aria-pressed="true">DRONE</button><button data-mode="foot" aria-pressed="false">FOOT</button>
<button data-mode="car" aria-pressed="false">CAR</button><button data-mode="jet" aria-pressed="false">JET</button>
<button id="armButton" aria-pressed="false">ARM</button><button id="cameraButton">CAMERA</button><button id="cityButton" title="Reload real OpenStreetMap city">CITY</button>
<button id="fullscreenButton" title="Fullscreen">⛶</button>
</div>
<a id="osmAttribution" href="https://www.openstreetmap.org/copyright"
 target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
<div id="gameMenu" role="dialog" aria-label="Launch SpawnCity">
<div id="welcome"><h1>SPAWNCITY</h1><p>One native WebGL2 renderer. Genuine Box3D physics and original 1 kHz Flight Core.</p>
<select id="worldSource" aria-label="Choose the source of real OpenStreetMap buildings">
<option value="demo">Real OSM demo: Konstanz · no GPS</option>
<option value="gps">My location · request GPS permission</option>
</select>
<button id="gameMenuStart" type="button">START</button><div id="gameMenuStatus" role="status">READY — no Three.js</div>
</div></div>
<script type="module" src="./sim/native_game_bootstrap.mjs"></script>
</body>
</html>
