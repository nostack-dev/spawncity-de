<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<title>SpawnCity — Native WebGL2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900;1,14..32,700..900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07111c;color:#f6fbff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
#viewport{position:fixed;inset:0;background:#0b1522;touch-action:none}
#viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));pointer-events:none;
font:600 12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:0 1px 2px #000a}
#hud strong{font-size:13px;font-weight:800;letter-spacing:.08em}#hud span{font-size:10px;letter-spacing:.14em;color:#9fb4c6}
#telemetry{margin-top:2px;color:#d5e2ee99;font-size:10px;max-width:42vw}
#status{margin-top:2px;color:#d7ffe6;max-width:46vw;font-size:12px}
#toolbar{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-radius:18px;background:#071523c9;
border:1px solid #9dc4ef37;z-index:5;max-width:calc(100vw - 16px);backdrop-filter:blur(12px)}
#toolbar button{background:#153148;border:1px solid #345775;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:800;min-width:38px}
/* Production chrome is the solo top bar. The native debug bar stays out of the live view. */
body.solo-flight #toolbar,body.solo-flight #help,body.solo-flight #hud{display:none!important}
#armButton{background:#6d2929!important}#armButton[aria-pressed=true]{background:#f5bd29!important}
#sticks{display:none;position:fixed;inset:0;pointer-events:none;z-index:2}
.joystick{position:absolute;bottom:18%;border:2px dashed #daeafd50;border-radius:50%;width:84px;height:84px;
display:grid;place-items:center;font-size:11px;color:#daebff90;letter-spacing:.08em}
#stickLeft{left:8%}#stickRight{right:8%}
#help{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);font-size:10px;pointer-events:none;z-index:4;color:#c7d8eaca;text-align:center;white-space:nowrap}
#osmAttribution{position:fixed;bottom:max(5px,env(safe-area-inset-bottom));left:8px;
 z-index:4;font:10px system-ui,sans-serif;color:#d3e4f6;text-decoration:none;
 text-shadow:0 1px 4px #001a;max-width:180px}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none;z-index:7}
#cross::before,#cross::after{content:"";position:absolute;background:#ffffffd0}
#cross::before{left:6px;top:0;width:2px;height:14px}#cross::after{left:0;top:6px;width:14px;height:2px}
#weaponBar{display:flex;gap:4px}
#weaponBar button[aria-pressed="true"]{background:#214a68;border-color:#69caff}
@media(pointer:coarse){#help{bottom:95px;white-space:normal;width:85vw}
#toolbar{top:max(8px,env(safe-area-inset-top));bottom:auto;padding:7px;gap:4px}#toolbar button{padding:9px 10px;font-size:11px}#hud{font-size:10px}}
@media(max-width:370px){#toolbar button{padding:8px 6px}#welcome{padding:16px}}
/* Title screen = the production menu (drone_simulator.html), copied verbatim. */
/* ---- Game start menu (shown instantly, before the game bundle loads) ---- */
#gameMenu{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:#0b0d10;color:#eef0f2;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#gameMenu[hidden]{display:none!important}
#gameMenu{transition:opacity .6s ease}#gameMenu.gm-leaving{opacity:0;pointer-events:none}
#gameMenuBg{position:absolute;inset:0;width:100%;height:100%;display:block}
#gameMenu .gm-center{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vh,22px);padding:24px;text-align:center}
#gameMenu .gm-title{position:relative;display:flex;flex-direction:column;align-items:center;font-family:"Inter",system-ui,-apple-system,sans-serif;font-weight:900;font-style:italic;font-size:clamp(34px,min(10vw,15vh),120px);letter-spacing:.02em;line-height:.9;color:#f4f5f6;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.6);padding:0 .08em .16em}
#gameMenu .gm-title>span{display:block}
#gameMenu .gm-title::after{content:"";position:absolute;left:4%;right:4%;bottom:.02em;height:.09em;background:linear-gradient(90deg,transparent,#ff7a1a 18%,#ffb02e 60%,transparent);transform:skewX(-24deg);box-shadow:0 0 18px rgba(255,122,26,.55)}
#gameMenu .gm-sub{font-weight:700;font-size:clamp(11px,1.6vw,15px);letter-spacing:.42em;color:rgba(238,240,242,.78);text-shadow:0 2px 4px rgba(0,0,0,.7)}
#gameMenuStart{margin-top:clamp(6px,2vh,18px);min-width:min(64vw,300px);padding:15px 28px;font:700 clamp(17px,2.4vw,22px) "Inter",system-ui,-apple-system,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#16120c;background:linear-gradient(180deg,#ffb02e,#ff7a1a);border:0;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 -3px 0 rgba(0,0,0,.18);text-shadow:none;cursor:pointer;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
#gameMenuStart:not([disabled]){animation:none}
#gameMenuStart:active{filter:brightness(.92)}
#gameMenuStart[disabled]{opacity:.7;cursor:default;animation:none;filter:saturate(.4)}
#gameMenuStatus{min-height:1.2em;font-size:11px;font-weight:700;letter-spacing:.3em;color:rgba(238,240,242,.62);text-shadow:0 1px 3px rgba(0,0,0,.7)}
@keyframes gmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#soundSwitch{position:fixed;z-index:100001;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:40px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(10,13,18,.56);border:1px solid rgba(255,255,255,.16);border-radius:6px;color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.45)}
#soundSwitch svg{width:20px;height:20px;display:block}
#soundSwitch[data-on="0"] .ss-wave{display:none}#soundSwitch[data-on="1"] .ss-x{display:none}
#soundSwitch[hidden],#musicSwitch[hidden]{display:none!important}
#musicSwitch{position:fixed;z-index:100001;top:max(10px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + 46px);width:40px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(10,13,18,.56);border:1px solid rgba(255,255,255,.16);border-radius:6px;color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.45)}
#musicSwitch svg{width:20px;height:20px;display:block}#musicSwitch[data-on="1"] .ms-x{display:none}#musicSwitch[data-on="0"]{color:rgba(255,255,255,.55)}
/* SpawnCity layout fixes. The deploy workflow inlines this file into drone_simulator.html
   right before </head>, so it wins over the game's own menu rules. */

/* Start menu: never crop. Flex `center` pushes overflow off the top edge where it can't be
   scrolled to; `safe center` + auto margins keep the top reachable and scroll the rest. */
#gameMenu{overflow-x:hidden;overflow-y:auto;align-items:safe center;justify-content:safe center;-webkit-overflow-scrolling:touch}
#gameMenu>#gameMenuBg{position:fixed}
#gameMenu .gm-center{margin:auto;box-sizing:border-box;max-width:100%;
  padding:calc(max(12px,env(safe-area-inset-top)) + 44px) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* Phones held sideways: title on the left, buttons on the right, everything on one screen. */
@media (orientation:landscape) and (max-height:560px){
  #gameMenu .gm-center{display:grid;grid-template-columns:minmax(0,auto) minmax(240px,340px);grid-auto-rows:auto;
    column-gap:clamp(24px,6vw,72px);row-gap:clamp(6px,1.8vh,10px);align-items:center;justify-items:center;
    padding-top:calc(max(10px,env(safe-area-inset-top)) + 44px)}
  #gameMenu .gm-title{grid-column:1;grid-row:1 / span 4;align-self:end;font-size:clamp(40px,min(22vh,10vw),104px)}
  #gameMenu .gm-sub{grid-column:1;grid-row:5 / span 2;align-self:start;font-size:clamp(10px,1.5vw,13px);letter-spacing:.34em}
  #gameMenu .gm-center>:not(.gm-title):not(.gm-sub){grid-column:2;width:100%;min-width:0;box-sizing:border-box}
  #gameMenu #gameMenuStart{margin-top:0;min-width:0;padding-top:clamp(9px,2.6vh,15px);padding-bottom:clamp(9px,2.6vh,15px)}
  #gameMenu #gameMenuWorld,#gameMenu #gameMenuChangelog{min-height:0;padding-top:clamp(7px,2vh,12px)!important;padding-bottom:clamp(7px,2vh,12px)!important}
  #gameMenu #gameMenuStatus{min-height:1em;margin:0}
  #gameMenu #startPlaceButton{margin-top:0}
}
@media (orientation:landscape) and (max-height:360px){
  #gameMenu .gm-center{padding-top:calc(max(6px,env(safe-area-inset-top)) + 40px);row-gap:5px}
  #gameMenu #gameMenuStatus{display:none}
}

/* Top-right toggles keep one size in the menu and in play (the in-game HUD sets 40x36),
   so moving them into the game view never makes them grow or shrink. */
#soundSwitch,#musicSwitch{height:36px;transition:none!important;animation:none!important}

/* Fallback EXIT (sim/spawncity_exit_guard.js): only shown when the HUD's own EXIT is missing. */
#scExit{position:fixed;z-index:2147483000;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));
  height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:10px;border:1.5px solid #ff8a6a99;
  background:#2a1410e6;color:#ffe2d8;font:900 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:.12em;cursor:pointer;touch-action:manipulation}
#scExit[hidden]{display:none!important}
#scExitAsk{position:fixed;inset:0;z-index:2147483001;display:flex;align-items:center;justify-content:center;background:#000a}
#scExitAsk[hidden]{display:none!important}
#scExitAsk .box{background:#12161c;border:1px solid #ffffff2a;border-radius:14px;padding:18px 20px;color:#eef0f2;text-align:center;font:800 13px/1.3 system-ui,sans-serif;letter-spacing:.06em;min-width:240px}
#scExitAsk .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
#scExitAsk button{min-width:96px;height:42px;border-radius:10px;border:1px solid #ffffff33;background:#1d232b;color:#fff;font:800 13px system-ui,sans-serif;letter-spacing:.1em}
#scExitAsk button[data-yes]{background:linear-gradient(180deg,#ffb02e,#ff7a1a);color:#16120c;border:0}
/* Production keeps SETTINGS in the in-game top bar and the GPS hint in the start-place pill. */
#gameMenu .phone-settings-button,#gameMenu #locationPermission{display:none!important}
</style>

<body>
<div id="viewport" aria-label="Native WebGL2 game viewport"></div>
<div id="cross" aria-hidden="true"></div>
<div id="hud" aria-live="polite"><strong>SPAWNCITY</strong> <span>WEBGL2</span><div id="telemetry">READY</div><div id="status">Real Box3D · 1 kHz Flight Core</div></div>
<div id="sticks" aria-hidden="true"><div class="joystick" id="stickLeft">MOVE</div><div class="joystick" id="stickRight">LOOK</div></div>
<div id="help">WASD move · mouse look · LMB fire · V drone · F car · E door · Tab menu · Esc quit</div>
<div id="toolbar" role="toolbar" aria-label="Game mode and camera">
<div id="weaponBar" role="group" aria-label="Weapon">
<button type="button" tabindex="-1" data-drone-weapon="gun">GUN</button>
<button type="button" tabindex="-1" data-drone-weapon="missile">ROCKETS</button>
<button type="button" tabindex="-1" data-drone-weapon="guided">GUIDED</button>
</div>
<button type="button" tabindex="-1" data-mode="drone" aria-pressed="true">DRONE</button><button type="button" tabindex="-1" data-mode="foot" aria-pressed="false">FOOT</button>
<button type="button" tabindex="-1" data-mode="car" aria-pressed="false">CAR</button><button type="button" tabindex="-1" data-mode="jet" aria-pressed="false">JET</button>
<button type="button" tabindex="-1" id="armButton" aria-pressed="false">ARM</button><button type="button" tabindex="-1" id="cameraButton">CAMERA</button><button type="button" tabindex="-1" id="cityButton" title="Reload real OpenStreetMap city">CITY</button>
<button type="button" tabindex="-1" id="fullscreenButton" title="Fullscreen">⛶</button>
</div>
<a id="osmAttribution" href="https://www.openstreetmap.org/copyright"
 target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
<div id="gameMenu" role="dialog" aria-label="Start game">
<canvas id="gameMenuBg" aria-hidden="true"></canvas>
<div class="gm-center" id="welcome">
<div class="gm-title" aria-label="SpawnCity"><span>SPAWN</span><span>CITY</span></div>
<div class="gm-sub">DRONE · CARS · ZOMBIES</div>
<button id="gameMenuStart" type="button" disabled>LOADING</button>
<div id="gameMenuStatus" role="status">PREPARING</div>
</div></div>
<button id="musicSwitch" type="button" aria-label="Music on/off" data-on="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/><path class="ms-x" d="M4 4l16 16"/></svg></button>
<button id="soundSwitch" type="button" aria-label="Effects on/off" data-on="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="ss-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="ss-x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
<script>
(function(){
  if(/[?&]dev=1/.test(location.search))document.body.classList.add("dev-ui");
  // Menu flyover: neon wireframe city. Black plate, green ground grid and
  // green wireframe blocks; the world stays fixed, only the camera moves.
  // It is drawn in a Web Worker on an OffscreenCanvas, so it keeps flying
  // perfectly smoothly while the main thread is busy loading the game
  // (script start-up, WebGL context, Box3D, shader compilation). Without
  // OffscreenCanvas it falls back to the same code on the main thread.
  var c=document.getElementById("gameMenuBg"),menu=document.getElementById("gameMenu"),DPR=Math.min(1.5,window.devicePixelRatio||1);
  function FLY(g,canvasRef,DPR,RAF){var W=0,H=0,HIDDEN=false,NEED_SIZE=true,GLOW=false,blocks=[],last=performance.now();
  function size(){W=canvasRef.w;H=canvasRef.h;canvasRef.c.width=Math.max(1,Math.round(W*DPR));canvasRef.c.height=Math.max(1,Math.round(H*DPR));g.setTransform(DPR,0,0,DPR,0,0);NEED_SIZE=false;}
  var STREET=10,FAR=520,GRID=16,BG="#0c0f13",LINE="rgba(255,190,120,.10)";
  var cam={x:0,y:12,z:0,yaw:0,roll:0,pitch:0};
  function rnd(a,b){return a+Math.random()*(b-a);}
  function shapeBlock(b,z){b.z0=z;b.z1=z+rnd(14,34);b.depth=rnd(12,22);b.h=Math.random()<.2?rnd(40,78):rnd(14,30);b.floors=Math.random()<.5;return b;}
  function addBlock(side,z){var b=shapeBlock({side:side},z);blocks.push(b);return b.z1+rnd(2,7);}
  [-1,1].forEach(function(side){var z=-10;while(z<FAR+60)z=addBlock(side,z);});
  var cy=1,sy=0;
  // world (x right, y up, z forward) -> screen
  function P(x,y,z,f){var dx=x-cam.x,dz=z-cam.z,rx=dx*cy-dz*sy,rz=dx*sy+dz*cy;if(rz<1.2)return null;return[W/2+rx/rz*f,H*(.55+cam.pitch)-(y-cam.y)/rz*f];}
  function path(p){for(var i=0;i<p.length;i++)if(!p[i])return false;g.beginPath();g.moveTo(p[0][0],p[0][1]);for(var k=1;k<p.length;k++)g.lineTo(p[k][0],p[k][1]);g.closePath();return true;}
  function face(p,fill){if(!path(p))return false;g.fillStyle=fill||BG;g.fill();g.stroke();return true;}
  function seg(a,b){if(!a||!b)return;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
  function frame(now){
    if(HIDDEN){RAF(frame);last=now;return;}
    var dt=Math.min(.05,(now-last)/1000);last=now;if(NEED_SIZE)size();
    var t=now/1000,speed=26+6*Math.sin(t*.11),prevX=cam.x;cam.z+=speed*dt;cam.x=Math.sin(t*.23)*2.6;cam.y=12+Math.sin(t*.37)*2.2;
    var lateral=(cam.x-prevX)/Math.max(dt,1e-3);cam.yaw+=((lateral/speed)*.6-cam.yaw)*Math.min(1,dt*2);cy=Math.cos(cam.yaw);sy=Math.sin(cam.yaw);cam.roll+=(-(lateral/speed)*.35-cam.roll)*Math.min(1,dt*2.5);cam.pitch=-.02+Math.sin(t*.29)*.012;
    // recycle what is behind the camera to the far end (world stays put)
    for(var k=0;k<blocks.length;k++){var b=blocks[k];if(b.z1<cam.z-8){var far=-1e9;for(var m=0;m<blocks.length;m++)if(blocks[m].side===b.side)far=Math.max(far,blocks[m].z1);shapeBlock(b,far+rnd(2,7));}}
    var f=H*.95,hz=H*(.55+cam.pitch);g.setTransform(DPR,0,0,DPR,0,0);
    // dusk sky: deep blue zenith -> burning orange horizon, sun glow at the vanishing point
    var sk=g.createLinearGradient(0,0,0,hz+2);sk.addColorStop(0,"#0b1322");sk.addColorStop(.55,"#33303a");sk.addColorStop(.86,"#a4532a");sk.addColorStop(1,"#e88a3c");g.fillStyle=sk;g.fillRect(0,0,W,hz+2);
    var sg=g.createRadialGradient(W/2,hz,0,W/2,hz,H*.7);sg.addColorStop(0,"rgba(255,190,110,.55)");sg.addColorStop(.25,"rgba(255,140,60,.18)");sg.addColorStop(1,"rgba(255,120,40,0)");g.fillStyle=sg;g.fillRect(0,0,W,hz+2);
    var gr=g.createLinearGradient(0,hz,0,H);gr.addColorStop(0,"#4a3428");gr.addColorStop(.18,"#1d1a19");gr.addColorStop(1,"#0d0e10");g.fillStyle=gr;g.fillRect(0,hz,W,H-hz);
    g.translate(W/2,hz);g.rotate(cam.roll);g.translate(-W/2,-hz);
    g.lineJoin="round";
    var zn=cam.z+1.5,zf=cam.z+FAR;
    // road: lane dashes and kerbs (world-fixed, so they stream past)
    g.strokeStyle="rgba(235,225,200,.55)";g.lineWidth=1.4;
    for(var dz=Math.ceil(zn/12)*12;dz<zf;dz+=12){g.globalAlpha=Math.max(.05,1-(dz-cam.z)/260);seg(P(0,0,dz,f),P(0,0,dz+5,f));}
    g.globalAlpha=1;g.strokeStyle="rgba(160,150,140,.45)";seg(P(-STREET+1.5,0,zn,f),P(-STREET+1.5,0,zf,f));seg(P(STREET-1.5,0,zn,f),P(STREET-1.5,0,zf,f));
    function fogged(r,gg,bb,d){var k=Math.min(1,Math.max(0,(d-30)/420));return"rgb("+Math.round(r+(170-r)*k*.75)+","+Math.round(gg+(95-gg)*k*.75)+","+Math.round(bb+(60-bb)*k*.75)+")";}
    function hash(a,b,c){var x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x);}
    // buildings: far to near, dark concrete with lit windows
    var list=blocks.filter(function(b){return b.z1>cam.z+1.5&&b.z0<cam.z+FAR;}).sort(function(a,b){return b.z0-a.z0;});
    g.lineWidth=1;
    for(var i=0;i<list.length;i++){var b=list[i],x=b.side*STREET,xb=b.side*(STREET+b.depth),z0=Math.max(b.z0,cam.z+1.6),z1=b.z1,dist=b.z0-cam.z;
      if(!b.seed)b.seed=Math.random()*1000;
      g.strokeStyle="rgba(0,0,0,.55)";
      face([P(x,0,z0,f),P(xb,0,z0,f),P(xb,b.h,z0,f),P(x,b.h,z0,f)],fogged(30,30,34,dist));
      var fac=[P(x,0,z0,f),P(x,0,z1,f),P(x,b.h,z1,f),P(x,b.h,z0,f)];
      if(face(fac,fogged(44,42,44,dist))){
        var near=fac[0]&&fac[1]?Math.abs(fac[0][0]-fac[1][0]):0;
        if(near>16){var cols=Math.floor((b.z1-b.z0)/3.4),rows=Math.floor(b.h/3.3);
